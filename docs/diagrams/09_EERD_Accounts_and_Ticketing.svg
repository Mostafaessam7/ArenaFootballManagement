<text x="40" y="910" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="12.5" fill="#6b7280">USER.Role is one of Admin, Organizer, TeamManager, Spectator, GateStaff (one role per account). Email is a unique candidate key.</text>
<text x="40" y="932" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="12.5" fill="#6b7280">A booking issues exactly Quantity tickets; (User, IdempotencyKey) is unique. Sum of offer capacities per event &lt;= venue capacity.</text>
<text x="40" y="954" font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="12.5" fill="#6b7280">TotalAmount = Quantity x UnitPrice and Remaining = Capacity - SoldQuantity are derived. Ticket Code is unique.</text>
