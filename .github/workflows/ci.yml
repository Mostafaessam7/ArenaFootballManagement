name: Build and test
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Arena.sln
      - run: dotnet build Arena.sln --configuration Release --no-restore
      - run: dotnet test Arena.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Arena.Infrastructure --startup-project src/Arena.Api --configuration Release --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
